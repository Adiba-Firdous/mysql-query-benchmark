# Example MySQL 8.0 tuning settings for the benchmark task.
#
# IMPORTANT:
# 1. Do not replace your complete my.ini with this file.
# 2. Back up your existing MySQL configuration first.
# 3. Add/change only settings that are appropriate for your machine.
# 4. Restart the MySQL80 Windows service after changing my.ini.
#
# Example location on the project machine:
# C:\ProgramData\MySQL\MySQL Server 8.0\my.ini

[mysqld]
# Example conservative settings for a local development machine.
# Values are intentionally modest; adjust for available RAM.
innodb_buffer_pool_size=128M
innodb_log_buffer_size=16M
table_open_cache=2000
max_connections=100
